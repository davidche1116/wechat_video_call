name: wechat_video_call
description: Flutter plugin that dials WeChat video/voice calls via user-calibrated accessibility gestures.
version: 2.0.0
homepage: https://github.com/davidche1116/wechat_video_call
repository: https://github.com/davidche1116/wechat_video_call
issue_tracker: https://github.com/davidche1116/wechat_video_call/issues
topics:
  - wechat
  - accessibility
  - automation
  - video-call

environment:
  sdk: ^3.13.4
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.dc16.wechat_video_call
        pluginClass: WeChatVideoCallPlugin
